services:
  mariadb:
    image: mariadb:lts
    container_name: mariadb_db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: my_root_password
      MARIADB_DATABASE: my_database
      MARIADB_USER: my_user
      MARIADB_PASSWORD: my_user_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mariadb_data:
    driver: local